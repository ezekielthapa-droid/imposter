<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One word. One imposter. Get your crew together and find the fake."
    />
    <meta name="theme-color" content="#0a0b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IMPOSTER" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>IMPOSTER — Party Game</title>
    <script>
      window.__imposterDeferredInstallPrompt = null;
      window.__imposterInstallPromptStatus = "waiting";
      console.info("[PWA] Install prompt listener registered; waiting for the browser event.", {
        secureContext: window.isSecureContext,
        userAgent: navigator.userAgent,
      });
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        if (window.__imposterDeferredInstallPrompt) {
          console.warn("[PWA] Duplicate beforeinstallprompt received; preserving the pending event.");
          return;
        }
        window.__imposterDeferredInstallPrompt = event;
        window.__imposterInstallPromptStatus = "available";
        console.info("[PWA] beforeinstallprompt received; native installation prompt is available.");
        window.dispatchEvent(new Event("imposterinstallpromptavailable"));
      });
      window.addEventListener("appinstalled", () => {
        window.__imposterDeferredInstallPrompt = null;
        window.__imposterInstallPromptStatus = "installed";
        console.info("[PWA] appinstalled event received.");
      });
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
